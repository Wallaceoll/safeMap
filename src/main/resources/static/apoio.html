<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Recursos de apoio - safeMap</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@1.55.0/dist/umd/lucide.min.js"></script>
    <link rel="stylesheet" href="css/base.css?v=1.2">
    <link rel="stylesheet" href="css/apoio.css?v=1.2">
    <script src="js/geo.js?v=1.2"></script>
    <script src="js/apoio-api.js?v=1.0"></script>
    <script src="js/theme.js?v=1.0"></script>
</head>

<body>
    <div class="app-container fade-in">
        <header class="app-header">
            <button class="back-btn" onclick="location.href='index.html'"><i data-lucide="arrow-left" size="24"></i></button>
            <h1 class="header-title">Recursos de apoio</h1>
            <button id="theme-toggle-btn" class="theme-toggle-btn">
                <i id="theme-icon" data-lucide="moon" size="22"></i>
            </button>
        </header>

        <main>
            <div class="search-container">
                <input type="text" class="search-input" id="resource-search" aria-label="Buscar região ou local de apoio" placeholder="Buscar região ou local" />
                <i data-lucide="search" class="search-icon" size="20"></i>
                <div id="search-suggestions" class="suggestions-list"></div>
            </div>

            <div class="location-status" id="location-status">
                <i data-lucide="map-pin" size="14"></i>
                <span>Localizando...</span>
            </div>

            <div class="resource-list" id="resource-list"></div>
        </main>

        <nav class="bottom-nav">
            <a href="index.html" class="nav-item">
                <div class="nav-icon-wrapper"><i data-lucide="map-pin"></i></div>
                <span>Mapa</span>
            </a>
            <a href="relatar.html" class="nav-item">
                <div class="nav-icon-wrapper"><i data-lucide="plus-circle"></i></div>
                <span>Relatar</span>
            </a>
            <a href="apoio.html" class="nav-item active">
                <div class="nav-icon-wrapper"><i data-lucide="handshake"></i></div>
                <span>Apoio</span>
            </a>
        </nav>
    </div>

    <script>
        const { formatAddress, searchAddress, renderSuggestions, reverseLocality } = window.safeMap.geo;

        let userCoords = null;
        let currentArea = null; // { district, city, state } da região pesquisada
        const listContainer = document.getElementById('resource-list');
        const searchInput = document.getElementById('resource-search');
        const suggestionsBox = document.getElementById('search-suggestions');
        const statusText = document.getElementById('location-status').querySelector('span');

        function showListMessage(text) {
            listContainer.innerHTML = '';
            const div = document.createElement('div');
            div.style.cssText = 'text-align:center; padding: 40px; color: var(--text-muted);';
            div.textContent = text;
            listContainer.appendChild(div);
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        function renderPois(pois) {
            listContainer.innerHTML = "";
            if (pois.length === 0) {
                showListMessage('Nenhum recurso encontrado nesta região.');
                return;
            }

            pois.forEach(p => {
                const tags = p.tags || {};
                const name = tags.name || tags.operator || "Recurso de Apoio";
                const suburb = tags['addr:suburb'] || tags['addr:neighbourhood'] || tags['addr:district'] || tags['addr:city_district'] || "";
                const city = tags['addr:city'] || (currentArea && currentArea.city) || "";
                const uf = tags['addr:state'] ? window.safeMap.geo.stateAbbr({ state: tags['addr:state'] }) : ((currentArea && currentArea.state) || "");
                const cityUf = [city, uf].filter(Boolean).join(' - ');
                const street = tags['addr:street'] || "Endereço não disponível";
                const number = tags['addr:housenumber'] || "S/N";

                const subtitle = [suburb, cityUf].filter(Boolean).join(' • ');
                const streetLine = tags['addr:street'] ? `${street}, ${number}` : street;
                const fullAddress = [suburb ? `${streetLine} - ${suburb}` : streetLine, cityUf].filter(Boolean).join(', ');

                const rawOpening = tags.opening_hours || "";
                const is24h = rawOpening.includes("24/7") || rawOpening.includes("24h") || rawOpening.includes("24 hours") ||
                              (!tags.opening_hours && (tags.amenity === 'police' || tags.amenity === 'hospital' || tags.emergency === 'yes'));
                const opening = is24h ? "Aberto 24h" : (tags.opening_hours || "Aberto das 08h às 18h");

                const card = document.createElement('div');
                card.className = "resource-card";
                card.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px;">
                        <h2 style="margin: 0; flex: 1; padding-right: 12px; font-size: 18px; font-weight: 700; color: var(--text-primary);">${name}</h2>
                        <span class="distance-tag">A ${p.distance.toFixed(1)} km</span>
                    </div>
                    <span class="card-subtitle">${subtitle}</span>

                    <div class="card-info">
                        <div class="info-item location">
                            <i data-lucide="map-pin" size="18"></i>
                            <span>${fullAddress}</span>
                        </div>
                        <div class="info-item status">
                            <i data-lucide="clock" size="18"></i>
                            <span>${opening}</span>
                        </div>
                    </div>

                    <div class="card-actions">
                        <button class="btn-card-action" onclick="window.open('https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lon}', '_blank')">
                            <i data-lucide="map-pin" size="18"></i> Ver rota
                        </button>
                    </div>
                `;
                listContainer.appendChild(card);
            });
            lucide.createIcons();
        }

        let debounceTimer;
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.trim();

            clearTimeout(debounceTimer);
            if (query.length < 3) {
                suggestionsBox.style.display = 'none';
                return;
            }

            debounceTimer = setTimeout(async () => {
                try {
                    // Chamado a cada provedor que responde; ignora se o usuário já digitou outra coisa
                    const mostrar = (results, typedNumber) => {
                        if (searchInput.value.trim() !== query) return;
                        renderSuggestions(suggestionsBox, results, {
                            itemClass: 'suggestion-item',
                            label: (item) => formatAddress(item, typedNumber),
                            onSelect: (item) => {
                                searchInput.value = formatAddress(item, typedNumber);
                                suggestionsBox.style.display = 'none';
                                loadApoio(parseFloat(item.lat), parseFloat(item.lon), item.display_name.split(',')[0]);
                            }
                        });
                    };
                    const { results, typedNumber } = await searchAddress(query,
                        { near: userCoords || undefined, autocomplete: true, onUpdate: mostrar });
                    mostrar(results, typedNumber);
                } catch (e) { console.error(e); }
            }, 500);
        });

        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                triggerSearch();
            }
        });

        document.querySelector('.search-icon')?.addEventListener('click', triggerSearch);

        document.addEventListener('click', (e) => {
            if (!searchInput.contains(e.target) && !suggestionsBox.contains(e.target)) {
                suggestionsBox.style.display = 'none';
            }
        });

        async function triggerSearch() {
            const query = searchInput.value.trim();
            if (!query) return;

            suggestionsBox.style.display = 'none';
            statusText.textContent = `Buscando região "${query}"...`;
            showListMessage('Buscando localização...');

            try {
                const { results, typedNumber } = await searchAddress(query, { near: userCoords || undefined });
                const result = results[0];

                if (result) {
                    const lat = parseFloat(result.lat);
                    const lon = parseFloat(result.lon);
                    const displayName = result.display_name.split(',')[0];
                    searchInput.value = formatAddress(result, typedNumber);
                    await loadApoio(lat, lon, displayName);
                } else {
                    statusText.textContent = `Região não encontrada. Tente outra busca.`;
                    showListMessage('Local não encontrado. Tente incluir a cidade (ex: "Boa Viagem, Recife").');
                }
            } catch (err) {
                console.error('Geocoding error:', err);
                statusText.textContent = `Erro na busca.`;
                showListMessage('Erro ao buscar local. Verifique sua conexão.');
            }
        }

        function applyInitialSearch(initialSearch) {
            if (initialSearch) {
                searchInput.value = initialSearch;
                renderResources(initialSearch);
            }
        }

        function askForSearch(message) {
            statusText.textContent = message;
            showListMessage('Ative a localização ou busque uma cidade ou endereço acima.');
        }

        async function initApoio() {
            const urlParams = new URLSearchParams(window.location.search);
            const initialSearch = urlParams.get('search');
            const paramLat = parseFloat(urlParams.get('lat'));
            const paramLng = parseFloat(urlParams.get('lng'));

            // Vindo do mapa (clique em um ponto de apoio): busca ao redor do ponto
            if (!isNaN(paramLat) && !isNaN(paramLng)) {
                await loadApoio(paramLat, paramLng, initialSearch || "ponto selecionado");
                applyInitialSearch(initialSearch);
                return;
            }

            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(async pos => {
                    userCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                    await loadApoio(userCoords.lat, userCoords.lng);
                    applyInitialSearch(initialSearch);
                }, (err) => {
                    askForSearch(err && err.code === 3
                        ? "Não foi possível obter sua localização a tempo. Use a busca acima."
                        : "GPS desativado. Use a busca acima.");
                    if (initialSearch) {
                        searchInput.value = initialSearch;
                        triggerSearch();
                    }
                }, { enableHighAccuracy: false, timeout: 15000, maximumAge: 60000 });
            } else {
                askForSearch("Geolocalização indisponível. Use a busca acima.");
                if (initialSearch) {
                    searchInput.value = initialSearch;
                    triggerSearch();
                }
            }
        }

        let currentPois = [];
        async function loadApoio(lat, lng, label = "Sua localização") {
            statusText.textContent = `Buscando recursos próximos a ${label}...`;
            showListMessage('Buscando recursos reais...');

            const [{ pois, failed }, area] = await Promise.all([
                window.safeMap.fetchPOIsAround(lat, lng),
                reverseLocality(lat, lng)
            ]);
            currentArea = area;

            if (failed && pois.length === 0) {
                statusText.textContent = `Não foi possível carregar os recursos.`;
                showListMessage('O serviço de pontos de apoio está indisponível no momento. Tente novamente em instantes.');
                currentPois = [];
                return;
            }

            currentPois = pois
                .filter(p => p.tags && (p.tags.amenity === 'hospital' || p.tags.amenity === 'police' ||
                                        p.tags.amenity === 'social_facility' || p.tags.social_facility))
                .map(p => ({ ...p, distance: calculateDistance(lat, lng, p.lat, p.lon) }))
                .sort((a, b) => a.distance - b.distance);

            renderPois(currentPois);
            const where = area && area.city ? `${label} (${[area.city, area.state].filter(Boolean).join(' - ')})` : label;
            statusText.textContent = failed
                ? `Mostrando parte dos recursos em ${where}`
                : `Mostrando recursos em ${where}`;
        }

        function normalizeString(str) {
            return str
                .toLowerCase()
                .normalize("NFD")
                .replace(/[̀-ͯ]/g, "");
        }

        function renderResources(filter = "") {
            const searchQuery = normalizeString(filter || searchInput.value);
            const filtered = currentPois.filter(p => {
                const name = normalizeString(p.tags.name || p.tags.operator || "");
                return name.includes(searchQuery);
            });
            renderPois(filtered);
        }

        initApoio();
        lucide.createIcons();

        const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
        document.querySelector('a[href="relatar.html"]')?.addEventListener('click', (e) => {
            if (!isLoggedIn) {
                e.preventDefault();
                window.location.href = 'login.html';
            }
        });
    </script>
</body>

</html>
